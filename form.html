<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Halaman form pendaftaran akun pengguna baru">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
    <title>Form Pendaftaran Akun</title>
</head>
<body>
    <main>
        <p>
            <a href="index.html">IMDb</a> | 
            <a href="blog.html">Blog</a> | 
            <a href="form.html">Form</a> | 
            <a href="cv.html">CV</a>
        </p>
        <hr>
        
        <h1>Form Pendaftaran Akun</h1>  

        <fieldset>
            <legend>Daftar Akun</legend>
            <form>
                <p>
                    <label for="nama">Nama Lengkap:</label>
                    <input type="text" id="nama" name="nama">
                </p>
                <p>
                    <label>Jenis Kelamin:</label>
                    <input type="radio" id="jk_l" name="jk" value="Laki-Laki">
                    <label for="jk_l">Laki-Laki</label>
                    
                    <input type="radio" id="jk_p" name="jk" value="Perempuan">
                    <label for="jk_p">Perempuan</label>
                </p>
                <p>
                    <label for="tempat_lahir">Tempat Lahir:</label>
                    <input type="text" id="tempat_lahir" name="tempat_lahir">
                </p>
                <p>
                    <label for="tanggal_lahir">Tanggal Lahir:</label>
                    <input type="date" id="tanggal_lahir" name="tanggal_lahir">
                </p>
                <p>
                    <label for="agama">Agama:</label>
                    <select id="agama" name="agama">
                        <option value="">-- Pilih Agama --</option>
                        <option value="Islam">Islam</option>
                        <option value="Katolik">Katolik</option>
                        <option value="Protestan">Protestan</option>
                        <option value="Hindu">Hindu</option>
                        <option value="Buddha">Buddha</option>
                        <option value="Konghucu">Konghucu</option>
                    </select>
                </p>
                <p>
                    <label>Hobi:</label>
                    <input type="checkbox" id="hobi_olahraga" name="hobi" value="Olahraga">
                    <label for="hobi_olahraga">Olahraga</label>
                    
                    <input type="checkbox" id="hobi_membaca" name="hobi" value="Membaca">
                    <label for="hobi_membaca">Membaca</label>
                    
                    <input type="checkbox" id="hobi_ngoding" name="hobi" value="Ngoding">
                    <label for="hobi_ngoding">Ngoding</label>
                </p>
                <p>
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password">
                </p>
                <p>
                    <input type="checkbox" id="persetujuan" name="persetujuan">
                    <label for="persetujuan">Dengan mendaftar saya setuju dengan Ketentuan dan Kebijakan Privasi Aplikasi.</label>
                </p>
                <p>
                    <input type="reset" value="Reset">
                    <input type="submit" value="Submit">
                </p>
            </form>
        </fieldset>
    </main>
</body>
</html>
